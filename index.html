<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1724" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WordDrill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>WordDrill</title>
<style>
  /* Night ink: deep navy paper with a cornflower accent (a cousin of Stanzas' blue-grey, without its amber) */
  :root {
    --paper: #EDF2F8; --surface: #FFFFFF; --ink: #17243A; --muted: #56677F; --rule: #D0DAE6;
    --accent: #2A62B8; --on-accent: #FFFFFF; --quote: #8AAEE0; --error: #B3402F; --ok: #2E7D5B; --alert: #D6382F; --warn: #C98A00; --alert-tint: rgba(214, 56, 47, .12); --box: #F3F0FA; --box-ink: #4B3F78;
    --tint: rgba(42, 98, 184, .08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F1724; --surface: #172235; --ink: #E2EAF4; --muted: #8C9DB4; --rule: #263550;
      --accent: #7AAEF7; --on-accent: #0A1424; --quote: #4C78B8; --error: #E9806F; --ok: #74C99A; --alert: #FF5A4E; --warn: #F2C14E; --alert-tint: rgba(255, 90, 78, .16); --box: #1E1B33; --box-ink: #C9BEF5;
      --tint: rgba(122, 174, 247, .12);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Armenian", "Noto Sans", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); overflow-x: clip; }
  [hidden] { display: none !important; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 6px 12px;
    cursor: pointer; min-height: 36px; touch-action: manipulation;
  }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.danger { color: var(--error); }
  button.icon { min-width: 36px; padding: 6px 8px; }
  button.icon.on { background: var(--tint); }
  button.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 8px; min-height: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.top {
    position: sticky; top: 0; z-index: 5; background: var(--paper);
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--rule);
  }
  .top-inner { max-width: 760px; margin: 0 auto; }
  .titlebar { display: flex; align-items: center; gap: 12px; padding-top: 8px; }
  .titlebar h1 { font-size: 20px; margin: 0; color: var(--accent); }
  #sync { flex: 1; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav { display: flex; gap: 2px; padding: 6px 0 8px; overflow-x: auto; scrollbar-width: none; }
  nav button { border: 0; background: none; color: var(--muted); font-weight: 600; padding: 6px 9px; position: relative; white-space: nowrap; }
  @media (max-width: 400px) { nav button { padding: 6px 6px; font-size: 15px; } }
  nav button.on { color: var(--ink); background: var(--tint); }
  .badge { position: absolute; top: 4px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: var(--alert); }
  /* A section of Prepared is empty: the tab pulses three times when that happens or the app opens */
  nav button.blink { animation: blink 1.2s ease-in-out 3; }
  @keyframes blink { 50% { background: var(--alert-tint); color: var(--alert); } }
  @media (prefers-reduced-motion: reduce) { nav button.blink { animation: none; background: var(--alert-tint); color: var(--alert); } }

  /* Recall timer: a small ring in the header, a panel under the title */
  .timer-btn { display: inline-flex; align-items: center; justify-content: center; position: relative; padding: 2px; min-width: 40px; }
  .timer-btn svg { display: block; }
  .timer-btn .track, .timer-panel .track { stroke: var(--rule); }
  .timer-btn circle { transition: stroke-dashoffset .2s linear; }
  .timer-mini-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .timer-btn.running .timer-mini-text { color: var(--ink); }
  .timer-panel { position: relative; display: flex; gap: 12px; align-items: center; margin: 6px 0 0; padding: 6px 40px 6px 8px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); }
  .timer-ring { position: relative; flex: none; width: 56px; height: 56px; }
  .timer-ring svg { display: block; }
  .timer-ring circle { transition: stroke-dashoffset .2s linear, stroke .3s ease; }
  .timer-secs { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer-side { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }
  .timer-cycle { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .timer-total { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .timer-total input { width: 64px; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 1px 6px; font-size: 16px; }
  .timer-vibrate { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .timer-vibrate input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .timer-buttons { display: flex; gap: 8px; }
  .timer-buttons button { min-width: 70px; min-height: 32px; padding: 3px 10px; }
  .timer-close { position: absolute; top: 50%; transform: translateY(-50%); right: 4px; border: 0; background: none; color: var(--muted); }
  .setting { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 8px 0; }
  .setting > span:first-child { min-width: 170px; }
  .setting input[type=number] { width: 80px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 8px; font-size: 16px; }
  kbd { font: 600 15px ui-monospace, Consolas, monospace; padding: 3px 8px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); }
  .date { color: var(--muted); margin: 14px 0 0; font-size: 15px; }
  .sec { margin: 18px 0 8px; }
  .sec h2 { font-size: 19px; margin: 0 0 8px; color: var(--accent); display: flex; align-items: baseline; gap: 8px; }
  .count { font-size: 14px; color: var(--muted); font-weight: 400; }
  .low { font-size: 13px; color: var(--alert); font-weight: 600; }
  p.low { margin: 0 0 8px; }
  /* Preparation: one sub-tab per area with its count; red when not enough for tomorrow */
  .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .subtab, .subtab.low { display: inline-flex; align-items: baseline; gap: 6px; font-size: 16px; font-weight: 600; padding: 5px 12px; border-radius: 999px; }
  .subtab .n { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .subtab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .subtab.on .n { color: inherit; opacity: .85; }
  .subtab.low { color: var(--alert); border-color: var(--alert); background: var(--alert-tint); }
  .subtab.low .n { color: var(--alert); font-weight: 700; }
  .subtab.low.on { background: var(--alert); border-color: var(--alert); color: var(--on-accent); }
  .subtab.low.on .n { color: inherit; }
  /* Preparation → Prepared | Queue */
  .seg { display: inline-flex; margin-top: 10px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: none; color: var(--muted); font-weight: 600; padding: 5px 14px; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button.on { background: var(--tint); color: var(--ink); }
  .queue-add { margin-top: 10px; }
  .quick-queue .seg { margin-right: 8px; max-width: 100%; overflow-x: auto; }
  .queue-add .add { flex: 1; margin: 0; }
  .queue-bar { justify-content: space-between; margin-top: 10px; }
  .queue-bar .note { margin: 0; }
  .targets { display: flex; flex-wrap: wrap; gap: 16px; }
  .targets label { display: flex; align-items: center; gap: 8px; }
  .area { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .area-name { flex: 1; min-width: 0; background: var(--surface); color: inherit; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 16px; }
  .add-area { margin-top: 12px; }
  .editor .row .split.idle { opacity: .5; }
  .editor .row .splits { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; margin: 0 0 10px; }
  .md p { margin: 0 0 8px; }
  .md > :last-child { margin-bottom: 0; }
  .md blockquote { margin: 0 0 8px; padding: 0 0 0 12px; border-left: 2px solid var(--quote); color: var(--muted); }
  .md blockquote p { margin: 0 0 4px; }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
  .md strong { font-weight: 700; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 4px 0 8px; line-height: 1.25; font-weight: 700; }
  .md h1 { font-size: 1.45em; }
  .md h2 { font-size: 1.3em; }
  .md h3 { font-size: 1.15em; }
  .md h4 { font-size: 1.05em; }
  .md h5, .md h6 { font-size: 1em; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md hr { border: 0; border-top: 1px solid var(--rule); margin: 12px 0; }
  .md u { text-underline-offset: 3px; }
  /* Box (``` … ```): set apart from the meaning, e.g. etymology */
  .md pre {
    margin: 0 0 8px; padding: 8px 12px; border-radius: 8px; background: var(--box); border: 1px solid var(--rule);
    color: var(--box-ink); font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .md .table { overflow-x: auto; margin: 0 0 8px; }
  .md table { border-collapse: collapse; font-size: 15px; }
  .md th, .md td { border: 1px solid var(--rule); padding: 4px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--box); color: var(--box-ink); font-weight: 600; }
  .md code { padding: 1px 5px; border-radius: 5px; background: var(--box); color: var(--box-ink); font: .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .card.collapsed .md { cursor: pointer; }
  .check-typed { margin: 8px 0 0; }
  /* Weekly check: what you typed next to the card */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .compare-typed { border-right: 1px solid var(--rule); padding-right: 14px; min-width: 0; }
  .compare-card { min-width: 0; }
  .compare .label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .typed-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 340px) { .compare { grid-template-columns: 1fr; } .compare-typed { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 8px; } }
  .tool.u { text-decoration: underline; text-underline-offset: 3px; }
  .tool.box { font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .md { -webkit-user-select: text; user-select: text; }
  button.remember { min-width: 56px; font-size: 18px; font-weight: 700; }
  .sec.later { opacity: .85; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  /* The ⋯ menu takes its own line and wraps on narrow phones */
  .actions .more { display: flex; flex-wrap: wrap; gap: 8px; flex-basis: 100%; }
  .actions .more button { white-space: nowrap; }
  .actions .more .danger { margin-left: auto; }
  button.add { width: 100%; border-style: dashed; color: var(--muted); background: none; }

  .editor { background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 8px; margin: 0 0 10px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .tool { min-width: 38px; padding: 4px 8px; }
  .tool.b { font-weight: 800; }
  .tool.i { font-style: italic; font-family: Georgia, serif; }
  .editor textarea {
    display: block; width: 100%; min-height: 96px; resize: none; overflow: hidden; border: 0; outline: none;
    background: none; padding: 4px 6px; font-size: 16px; line-height: 1.5;
  }
  .tool.hist { margin-left: auto; color: var(--muted); }
  .versions { border-top: 1px solid var(--rule); margin-top: 6px; padding-top: 6px; display: grid; gap: 4px; }
  .versions .note { margin: 0 0 4px; }
  .version { display: flex; gap: 10px; text-align: left; min-height: 0; padding: 6px 10px; }
  .version .when { color: var(--muted); font-size: 14px; flex: none; }
  .version .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Recall: cards typed from memory before Today's list is shown */
  .typed { display: flex; gap: 6px; align-items: flex-start; margin: 0 0 6px; }
  .typed .num { flex: none; min-width: 24px; padding-top: 9px; text-align: right; color: var(--muted); font-size: 14px; }
  .typed textarea, textarea.prompt {
    flex: 1; width: 100%; resize: none; overflow: hidden; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    padding: 7px 10px; font-size: 16px; line-height: 1.5; min-height: 42px;
  }
  .typed textarea:focus, textarea.prompt:focus { outline: none; border-color: var(--accent); }
  .typed .icon { flex: none; color: var(--muted); }
  .typed textarea { transition: border-color .3s ease; }
  /* While the timer runs, a line under the header fills from left to right over the WHOLE run
     (--timer-total 0…1) in the colour of the part (green, yellow, red), with ticks at the milestones (about 2/5
     and 4/5 of the time, on cycle ends: --timer-m1, --timer-m2) */
  header.top::after {
    content: ''; position: absolute; left: 0; bottom: -1px; height: 4px; width: 0; background: var(--timer-part, var(--timer-color));
  }
  .timer-running header.top::after { width: calc(var(--timer-total, 0) * 100%); }
  .timer-running header.top::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 8px; z-index: 2; pointer-events: none;   /* the ticks, over the fill */
    background:
      linear-gradient(var(--ink), var(--ink)) calc(var(--timer-m1, 40%) - 1px) 0 / 3px 100% no-repeat,
      linear-gradient(var(--ink), var(--ink)) calc(var(--timer-m2, 80%) - 1px) 0 / 3px 100% no-repeat;
  }
  .timer-running header.top::after { z-index: 1; }
  /* On a phone (the eyes are on the keyboard) the whole app takes the cycle colour, and flashes three times
     when a new cycle starts; a computer keeps its colours */
  @media (pointer: coarse) {
    body, header.top { transition: background-color .5s ease; }
    .timer-running body, .timer-running header.top { background: color-mix(in srgb, var(--timer-part, var(--timer-color)) 15%, var(--paper)); }
    .timer-flash body, .timer-flash header.top { animation: timer-flash .4s ease-in-out 3; }
  }
  @keyframes timer-flash { 50% { background: color-mix(in srgb, var(--timer-part, var(--timer-color)) 80%, var(--paper)); } }
  /* Everywhere, the Recall boxes flash three times too */
  .timer-flash .typed textarea { animation: timer-flash-box .4s ease-in-out 3; }
  @keyframes timer-flash-box { 50% { background: var(--timer-part, var(--timer-color)); } }
  @media (prefers-reduced-motion: reduce) { .timer-flash body, .timer-flash header.top, .timer-flash .typed textarea { animation: none; } }
  /* While the timer runs, the boxes show the colour of the cycle (red, green in turn) */
  /* …and fill from left to right as the cycle goes (--timer-progress 0…1) */
  .timer-running .typed textarea {
    border-color: var(--timer-color);
    background: linear-gradient(to right, color-mix(in srgb, var(--timer-color) 34%, var(--surface)) calc(var(--timer-progress, 0) * 100%),
      color-mix(in srgb, var(--timer-color) 8%, var(--surface)) 0);
  }
  .timer-running .typed textarea:focus { border-color: var(--timer-color); box-shadow: 0 0 0 1px var(--timer-color); }
  textarea.prompt { display: block; resize: vertical; overflow: auto; min-height: 220px; font-size: 16px; }
  .recall-bar { margin-top: 4px; }
  .recall-bar .note { flex: 1; min-width: 160px; }
  select.move-sec { min-height: 36px; padding: 4px 8px; font-size: 15px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  .reminder, .done-box {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    margin: 28px 0 8px; padding: 12px 14px; border-radius: 12px; background: var(--tint); border: 1px solid var(--accent);
  }
  .done-box.done { border-color: var(--rule); background: none; color: var(--ok); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 4px; }
  .bar label { color: var(--muted); }
  select, input[type=search], #codeInput {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 6px 10px; min-height: 36px; font-size: 16px;
  }
  input[type=search] { flex: 1; min-width: 160px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .empty { color: var(--muted); margin: 20px 0; }
  .note { color: var(--muted); font-size: 14px; }

  #login { max-width: 480px; margin: 48px auto; }
  #login h2 { color: var(--accent); }
  #login details { margin-top: 24px; }
  #login summary { cursor: pointer; color: var(--muted); }
  #login ol { padding-left: 20px; }
  #codeInput { width: 100%; margin: 8px 0; }

  #toast {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translate(-50%, 140%);
    max-width: min(92vw, 560px); background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 12px;
    display: flex; gap: 8px; align-items: center; transition: transform .2s; z-index: 10; font-size: 15px;
  }
  #toast.show { transform: translate(-50%, 0); }
  #toast.err { background: var(--error); color: #fff; }
  #toast .link { color: var(--paper); text-decoration: underline; }
</style>
</head>
<body>
<section id="login" hidden>
  <main>
    <h2>Connect Dropbox</h2>
    <p>WordDrill keeps your cards as Markdown files in Dropbox → Apps → WordDrill.</p>
    <button id="loginRedirect" class="primary" type="button">Connect Dropbox</button>
    <details id="codeBox">
      <summary>Using the Home Screen app on iPhone? Connect with a code</summary>
      <ol>
        <li>Tap “Get a code”, allow access, and copy the code Dropbox shows.</li>
        <li>Come back here and paste it below.</li>
      </ol>
      <button id="loginCode" type="button">Get a code</button>
      <input id="codeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Code from Dropbox" aria-label="Code from Dropbox">
      <button id="codeSubmit" class="primary" type="button">Connect</button>
    </details>
  </main>
</section>
<div id="app" hidden>
  <header class="top">
    <div class="top-inner">
      <div class="titlebar">
        <h1>WordDrill</h1>
        <span id="sync" role="status"></span>
        <button type="button" id="timerBtn" class="icon timer-btn" aria-label="Timer"></button>
        <button type="button" class="icon" data-tab="settings" title="Settings" aria-label="Settings">⚙</button>
      </div>
      <div id="timerPanel" class="timer-panel" hidden></div>
      <nav>
        <button type="button" data-tab="today">Today</button>
        <button type="button" data-tab="check">Weekly check<span id="checkBadge" class="badge" hidden></span></button>
        <button type="button" data-tab="prepared">Preparation<span id="preparedBadge" class="badge" hidden></span></button>
        <button type="button" data-tab="archive">Archive</button>
      </nav>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
